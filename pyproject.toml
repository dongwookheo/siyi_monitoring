[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sbus_monitor"
version = "0.1.0"
description = "Professional SBUS monitoring and filtering system"
readme = "README.md"
requires-python = ">=3.11" # tomllib 사용을 위해 3.11 권장
dependencies = [
    "pyserial",
    "rich",
]

[project.scripts]
sbus-run = "sbus_monitor.main:main"

[tool.setuptools.packages.find]
where = ["src"]